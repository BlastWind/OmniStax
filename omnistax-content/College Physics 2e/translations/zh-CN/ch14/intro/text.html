<figure class="photo" id="fig-foote" data-figure="14.1">
  <img src="/media/ch14/OSX_CP2e_Figure_15_00_01.jpg" alt="一幅画，画中一个人站着，手里拿着一张纸，纸上似乎是数据表格。背景中有烧瓶和泵等各种仪器。">
  <figcaption><span class="eyebrow">Figure 14.1</span><span>Eunice Newton Foote 最早确定了二氧化碳、水蒸气与全球变暖可能性之间的关系。她设计并进行了一系列实验，以揭示不同气体截留<span data-concept="heat">热量</span>的能力，并描述了后来被称为温室气体的那些气体。（来源：Carlyn Iverson, NOAA Climate.gov）</span></figcaption>
</figure>
<p><span data-concept="energy">能量</span>可以有多种形式，而<span data-concept="heat">热量</span>是其中最引人入胜的一种。<span data-concept="heat">热量</span>往往是隐蔽的，因为它只在传递过程中存在，并且通过若干截然不同的方式传递。<span data-concept="heat">热</span>传递触及我们生活的方方面面，也帮助我们理解宇宙如何运转。它解释了我们在晴朗微风的夜晚感到的寒意，也解释了地核为什么至今尚未冷却。本章定义并探讨<span data-concept="heat">热</span>传递、它的效应，以及<span data-concept="heat">热</span>传递的方式。这些主题既是基础性的，也是实用的，在后面的章节中将经常提到。</p>
</section>
