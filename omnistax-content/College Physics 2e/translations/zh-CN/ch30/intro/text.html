<p>从童年起，我们就知道<span data-concept="atom">原子</span>是我们周围一切事物的子结构，从我们呼吸的空气，到覆盖林间小径的秋叶。<span data-concept="atom">原子</span>肉眼看不见，它们的存在和性质被用来解释许多现象——这是贯穿本教材的一个主题。在本章中，我们讨论<span data-concept="atom">原子</span>及其自身子结构的发现；然后应用<span data-concept="quantum-mechanics">量子力学</span>来描述<span data-concept="atom">原子</span>及其性质和相互作用。一路走来，我们将发现，正如当年作出最初发现的科学家们一样，新的概念不断涌现，其应用远远超出了原子<span data-concept="physics">物理学</span>的范围。</p>
