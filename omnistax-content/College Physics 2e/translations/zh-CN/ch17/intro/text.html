  <figcaption><span class="eyebrow">Figure 17.1</span><span>这棵树倒下已有一段<span data-concept="time">时间</span>了。它倒下时，空气中的原子受到了扰动。无论当时有没有人在场听到，物理学家都会把这种扰动称为声音。（来源：B.A. Bowen Photography）</span></figcaption>

<p>如果一棵树在森林里倒下，而没有人在场听到，它是否发出了<span data-concept="sound">声音</span>？这个古老的哲学问题，答案取决于你如何定义<span data-concept="sound">声音</span>。如果<span data-concept="sound">声音</span>只有在有人感知到时才存在，那么就没有<span data-concept="sound">声音</span>。然而，如果我们从<span data-concept="physics">物理学</span>的角度来定义<span data-concept="sound">声音</span>，也就是物质中<span data-concept="atom">原子</span>的一种扰动，从其起源向外传播（换句话说，是一种波），那么就<em>有</em><span data-concept="sound">声音</span>，即使当时没有人在场听到。</p>
<p>这样的波就是我们所说的<em><span data-concept="sound">声音</span></em>这一物理现象。对它的知觉就是<span data-concept="hearing">听觉</span>。物理现象本身及其知觉都很有意思，本教材都会加以讨论。我们将探究<span data-concept="sound">声音</span>和<span data-concept="hearing">听觉</span>；它们彼此相关，但并不是一回事。我们还将探究<span data-concept="sound">声波</span>的许多实际用途，例如医学成像。</p>
