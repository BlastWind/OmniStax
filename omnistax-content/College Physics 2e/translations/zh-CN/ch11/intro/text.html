<p>我们生活中所珍视的许多东西都是流体：一口清新的冬日空气；燃气灶上炽热的蓝色火焰；我们饮用、游泳和沐浴所用的水；血管里的血液。究竟什么是流体？我们能用已经学过的<span data-concept="law">定律</span>来理解<span data-concept="fluid">流体</span>吗，还是对它们的研究会引出新的<span data-concept="law">定律</span>？静止的<span data-concept="fluid">流体</span>的物理特性，以及支配其行为的一些<span data-concept="law">定律</span>，是本章的主题。<span data-concept="fluid-dynamics">流体动力学</span>及其在生物学和医学中的应用则探讨流体流动的各个方面。</p>
