<section id="curved-paths">
<figure class="photo" id="fig-tennis" data-figure="3.1">
  <img src="/media/ch03/OSX_CP2e_Figure_03_00_01a.jpg" alt="一名坐轮椅的网球运动员在网球场上击球，球正好接触到球拍。" data-width="350">
  <figcaption><span class="eyebrow">Figure 3.1</span><span>即使球以高速沿相对笔直的路线飞行，击中网球也已经够难了。然而，大多数运动沿的是曲线路径，而不是直线路径。网球运动员必须考虑球的弧线和旋转的影响，同时还要预测球会怎样反弹，并计划好击球的落点。沿曲线路径的运动是二维或三维运动，可以用与一维运动类似的方式来描述。（来源：Edwin Martinez/Flickr）</span></figcaption>
</figure>
<p>篮球的弧线、卫星的轨道、骑自行车转弯、游泳者跳入泳池、血从伤口喷涌而出，以及小狗追着自己的尾巴转圈，这些只是沿曲线路径<span data-concept="motion">运动</span>的几个例子。事实上，自然界中大多数<span data-concept="motion">运动</span>遵循的是曲线路径，而不是直线。在平坦表面或平面上沿曲线路径的<span data-concept="motion">运动</span>（例如台球桌上的球或溜冰场上的滑冰者）是二维的，因此由二维<span data-concept="kinematics">运动学</span>来描述。不限于平面的<span data-concept="motion">运动</span>，例如汽车沿着蜿蜒的山路行驶，则由三维<span data-concept="kinematics">运动学</span>来描述。二维和三维<span data-concept="kinematics">运动学</span>都是上一章为直线<span data-concept="motion">运动</span>建立的一维<span data-concept="kinematics">运动学</span>的简单推广。这一简单的推广将使我们能够把<span data-concept="physics">物理学</span>应用于更多的情形，也会让我们对自然界获得意想不到的认识。</p>
</section>
