<p>在“<span data-concept="electric-charge">电荷</span>与<span data-concept="electric-field">电场</span>”中，我们只是触及了（或者至少是摩擦了一下）电现象的表面。电最为人熟知的两个方面是它的<span data-concept="energy">能量</span>和<em><span data-concept="potential-difference">电压</span></em>。例如，我们知道大量的<span data-concept="electrical-energy">电能</span>可以储存在电池中，可以通过输电线跨越全国传输，还可以从云层跳向树木，使树液爆裂。类似地，在分子层面上，<em>离子</em>穿过细胞膜并传递信息。我们也知道与电相关的<span data-concept="potential-difference">电压</span>。电池的电压通常是<span data-type="voltage">几伏</span>，你家中的插座提供<span data-type="voltage">120 伏</span>，输电线的电压可高达<span data-type="voltage">数十万伏</span>。但是，<span data-concept="energy">能量</span>和<span data-concept="potential-difference">电压</span>并不是一回事。例如，摩托车蓄电池很小，很难成功地取代大得多的汽车蓄电池，然而两者具有<span data-type="voltage">相同的<span data-concept="potential-difference">电压</span></span>。在本章中，我们将研究<span data-concept="potential-difference">电压</span>与<span data-concept="electrical-energy">电能</span>之间的关系，并开始探索电的许多应用中的一部分。</p>
