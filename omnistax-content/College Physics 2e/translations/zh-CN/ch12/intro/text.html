<figure class="photo" id="fig-firefighters" data-figure="12.1">
  <img src="/media/ch12/Figure_13_00_01a_D.jpg" alt="照片中，一群身穿制服的消防员正用水带扑灭一场大火，火焰吞噬着两辆汽车。">
  <figcaption><span class="eyebrow">Figure 12.1</span><span>这一场景中有许多流体在流动。消防水带中喷出的水和火中冒出的烟是看得见的流动。不太看得见的，是空气的流动，以及地面上和救火人员体内流体的流动。（来源：Andrew Magill, Flickr）</span></figcaption>
</figure>
<p>我们已经讨论过许多<span data-concept="fluid">流体</span>处于静止状态的情形。但就其定义而言，<span data-concept="fluid">流体</span>是会流动的。例子随手可得——篝火升起一柱烟，水从消防水带中涌出，血液在你的血管中奔流。上升的烟为什么会卷曲盘绕？喷嘴是怎样增大从水带中喷出的水的速率的？身体是如何调节血流的？研究<span data-concept="motion">运动</span>中的<span data-concept="fluid">流体</span>的<span data-concept="physics">物理学</span>——<strong><span data-concept="fluid-dynamics">流体动力学</span></strong>——使我们能够回答这些以及许多其他问题。</p>
</section>
