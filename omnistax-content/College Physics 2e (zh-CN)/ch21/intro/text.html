<p>电路随处可见。有些很简单，比如手电筒中的电路。另一些，比如超级计算机中的电路，则极其复杂。</p>
<p>这一组模块把电路的主题推进到<span data-concept="simple-circuit">简单电路</span>之外。当电路是纯电阻性时，本节中的一切对直流和交流都适用。一旦涉及<span data-concept="capacitance">电容</span>，情形就复杂起来。我们确实要考虑<span data-concept="capacitor">电容器</span>与直流<span data-concept="potential-difference">电压</span>源相连时会发生什么，但<span data-concept="capacitor">电容器</span>和其他非电阻性器件与交流的相互作用，则留待以后的一章讨论。最后，本章还将介绍若干重要的直流仪表，例如测量<span data-concept="potential-difference">电压</span>和<span data-concept="electric-current">电流</span>的<span data-concept="meter-and-galvanometer">电表</span>。</p>
