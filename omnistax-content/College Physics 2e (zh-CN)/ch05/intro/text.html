<p>描述髋关节所受的<span data-concept="force">力</span>。采取了哪些措施来确保它成为一个良好的活动关节？根据图 5.1 中的照片（针对成年人），估算这个人工装置的尺寸。</p>
<p>很难把<span data-concept="force">力</span>分成各种类型（除了前一章讨论过的四种基本<span data-concept="force">力</span>）。我们知道，合<span data-concept="force">力</span>会影响物体的<span data-concept="motion">运动</span>、<span data-concept="position">位置</span>和形状。此时不妨来看一些特别有趣而且常见的<span data-concept="force">力</span>，它们将为牛顿<span data-concept="motion">运动</span><span data-concept="law">定律</span>提供进一步的应用。我们所想到的是<span data-concept="friction">摩擦力</span>、空气或液体的阻力，以及<span data-concept="deformation">形变</span>所涉及的<span data-concept="force">力</span>。</p>
