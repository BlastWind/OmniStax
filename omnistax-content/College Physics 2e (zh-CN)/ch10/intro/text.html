<figure class="photo" id="fig-tornado" data-figure="10.1">
  <img src="/media/ch10/Figure_11_00_01a.jpg" alt="一个巨大的深色龙卷风漏斗从不祥的风暴云层向下延伸到地面，左侧有一棵孤树的剪影，衬在昏暗的地平线上。">
  <figcaption><span class="eyebrow">Figure 10.1</span><span>一提到龙卷风，人们脑海中便会浮现出原始而毁灭性的力量。龙卷风能把房屋像纸做的一样吹走，还有过让稻草秆刺穿树干的记录。它们以漏斗状从云层中垂下，并且剧烈旋转，尤其是在最窄的底部，产生的风速可高达 <span data-type="velocity">500 km/h</span>。（来源：Daphne Zaras, U.S. National Oceanic and Atmospheric Administration）</span></figcaption>
</figure>
<p>龙卷风为什么会旋转？又为什么转得这么快？答案是，产生龙卷风的气团本身就在转动，而当气团的半径减小时，它们的转动速率就会增大。滑冰者增大<span data-type="angular-rate">自己的转速</span>，方式与此完全类似，如图 10.2 所示。滑冰者开始转动时四肢伸展，然后把四肢向身体收拢，就增大了<span data-type="angular-rate">自己的转速</span>。同样的<span data-concept="physics">物理学</span>既描述了滑冰者令人心潮澎湃的旋转，也描述了龙卷风撕扯般的<span data-concept="force">力</span>。</p>
<figure class="photo" id="fig-skater" data-figure="10.2">
  <img src="/media/ch10/Figure_11_00_02a.jpg" alt="图中是一位花样滑冰运动员，右腿向上抬起、越过头顶。她双臂举过头顶，握住抬起那条腿的冰鞋。滑冰者正绕竖直轴旋转。" data-width="175">
  <figcaption><span class="eyebrow">Figure 10.2</span><span>这位花样滑冰运动员把双臂和伸出的腿向转轴收拢，从而增大了<span data-type="angular-rate">自己的转速</span>。（来源：Luu，Wikimedia Commons）</span></figcaption>
</figure>
<p>显然，<span data-concept="force">力</span>、<span data-concept="energy">能量</span>和<span data-concept="power">功率</span>都与转动<span data-concept="motion">运动</span>相关联。本章将讨论转动<span data-concept="motion">运动</span>的这些方面和其他方面。我们将看到，转动<span data-concept="motion">运动</span>的所有重要方面，要么已经为直线<span data-concept="motion">运动</span>定义过，要么在直线<span data-concept="motion">运动</span>中有完全对应的类比量。首先，我们来看<span data-concept="angular-acceleration">角加速度</span>——它是直线<span data-concept="acceleration">加速度</span>的转动类比。</p>
