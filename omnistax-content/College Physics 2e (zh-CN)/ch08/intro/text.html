<p>我们在日常用语中以多种方式使用“动量”（momentum）一词，其中大多数用法与它精确的科学定义是一致的。我们说运动队或政客获得并保持取胜的势头（momentum）。我们也意识到，动量与碰撞有关。例如，看着照片中相撞并倒在地上的橄榄球运动员，我们预期<span data-type="momentum">他们的动量</span>会对随之而来的碰撞产生很大的影响。一般来说，动量意味着一种沿原来路线继续前进的趋势——沿相同的<span data-concept="vector-direction">方向</span>运动——并且与很大的<span data-concept="mass">质量</span>和速率相联系。</p>
<p>动量与<span data-concept="energy">能量</span>一样重要，因为它是守恒的。自然界中只有少数几个<span data-concept="physical-quantity">物理量</span>是守恒的，研究它们能让我们对自然如何运作获得根本性的认识，在研究动量的过程中我们将看到这一点。</p>
</section>
