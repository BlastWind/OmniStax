<section id="electric-current-everywhere">
<figure class="photo" id="fig-srisailam-dam" data-figure="20.1">
  <img src="/media/ch20/Figure_20_00_01.jpg" alt="大量的水从一座水电站大坝的闸门中奔涌而出。">
  <figcaption><span class="eyebrow">Figure 20.1</span><span>大量的<span data-concept="energy">电能</span>通过电荷的运动，也就是通过<span data-concept="electric-current">电流</span>，从这座水电站——位于印度克里希纳河沿岸的斯里赛拉姆发电站——输送出去。（来源：Chintohere, Wikimedia Commons）</span></figcaption>
</figure>
<p>手持计算器上闪烁的数字、把视觉信号传向大脑的神经冲动、向计算机屏幕发送信号的<span data-concept="ultrasound">超声</span>设备、大脑向婴儿发出让脚趾抽动的指令、拖着车厢翻越山口的电力列车、向城市和乡村用户输送<span data-concept="energy">能量</span>的水电站——这些以及许多其他电的例子都涉及<em><span data-concept="electric-current">电流</span>，即电荷的运动</em>。人类确实已经驾驭了电这一技术的基础，使我们的生活质量得到改善。前面两章集中讨论<span data-concept="static-electricity">静电</span>以及支配其行为的基本<span data-concept="force">力</span>，接下来的几章则将讨论涉及<span data-concept="electric-current">电流</span>的电现象和磁现象。除了探讨电的应用之外，我们还将对自然获得新的认识——尤其是这一事实：一切磁都来源于<span data-concept="electric-current">电流</span>。</p>
</section>
