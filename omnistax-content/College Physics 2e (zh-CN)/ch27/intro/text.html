  <figcaption><span class="eyebrow">Figure 27.1</span><span>凯瑟琳·伯尔·布洛杰特（Katharine Burr Blodgett，1898–1979）是一位物理学家和化学家，在表面和薄膜的研究方面取得了重大进展。她研制的槽至今仍在世界各地成千上万个实验室中使用，她发明的增透玻璃对电影、医学和科学研究领域产生了巨大影响。（来源：Smithsonian Institution）</span></figcaption>
</figure>
<p>如果你曾看着阳光下肥皂泡上的红、蓝、绿，并好奇草黄色的肥皂水怎么会产生这些颜色，那么你就触及了只能用光的波动性来解释的众多现象之一（见图 27.2）。油膜上看到的颜色，或者光盘反射的光中看到的颜色，也是如此。这些现象以及其他一些有趣的现象，例如白光通过窄缝时被<span data-concept="dispersion">色散</span>成彩虹般的各种颜色，都无法用<span data-concept="geometric-optics">几何光学</span>完全解释。在这些情形中，光与小物体相互作用，并表现出它的波动特性。光学中研究光表现出波动特性时（特别是与小物体相互作用时）的行为的分支，称为<strong><span data-concept="wave-optics">波动光学</span></strong>（有时也称为物理光学）。它就是本章的主题。</p>
